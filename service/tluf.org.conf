# tluf.org — nginx site config (kit copy).
# The LIVE config on awsbox is certbot-managed (TLS blocks added by
# certbot) and must not be overwritten from this file. The API proxy
# blocks below are inserted into the live config by install-submit.sh
# (via nginx-insert.py); this copy carries them so a from-scratch
# install has the full shape.
server {
    listen 80;
    listen [::]:80;
    server_name tluf.org www.tluf.org;

    root /sites/web/tluf.org;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # tluf-submit-api: paper submission service (loopback 127.0.0.1:8643)
    location = /api/submit {
        proxy_pass http://127.0.0.1:8643;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8643;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
